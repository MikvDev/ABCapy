<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <main>
        <div id="container-cadastro">
            <form action="">
                <img src="/assets/images/ChatGPT Image 10 de out. de 2025, 15_05_56 2.svg"  id="logo-img" alt="logo-abcaby">
                <h4>CADASTRO</h4>
                <span id="span-subtitle">Junte-se à aventura com a Capy</span>
                <div class="container-input">

                    <input type="name" name="nome" id="nome" placeholder="Nome do responsável">
                
                </div>
                <div class="container-input">
                    <input type="email" name="email" id="email"  placeholder="E-mail" autocomplete="off">
                  
                </div>
                <div class="container-input">

                    <input type="password" name="senha"  id="senha"  placeholder="senha" autocomplete="off">
                    <img  id="eye"     src="/assets/images/Vector.svg" alt="eye-passw">
                </div>
                <div class="container-input">
                    <input type="password" name="senha-confirmar" id="senha-confirmar" placeholder="Confirmar senha" autocomplete="off">
                    <img id="eye"   src="/assets/images/Vector.svg" alt="eye-passw">
                </div>
               
                    <button><a href="">CONTINUAR</a></button>
                <span><a href="/pages/login.html">Já tem uma conta? Entrar</a></span>
              
                
            </form>
        </div>
    </main>
</body>
</html>
